<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>University Attendance Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
  <div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-sm p-4 login-card">
      <h2 class="text-center mb-2">University Attendance</h2>
      <p class="text-center text-muted mb-4">Login to continue</p>

      <form>
        <div class="mb-3">
          <label class="form-label">Email / User ID</label>
          <input type="text" class="form-control" placeholder="Enter email or user ID">
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" placeholder="Enter password">
        </div>

        <div class="mb-3">
          <label class="form-label">Role</label>
          <select class="form-select">
            <option>Admin</option>
            <option>Faculty</option>
            <option>Student</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
    </div>
  </div>
</body>
</html>
